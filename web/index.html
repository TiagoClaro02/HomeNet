<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeNet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HomeNet</h1>
        <div id="connection-status" class="status unknown">
            Connecting...
        </div>
    </header>

    <main>

        <section class="card">
            <h2>System</h2>

            <div class="grid">
                <div>
                    <span class="label">Hostname</span>
                    <span id="hostname">—</span>
                </div>

                <div>
                    <span class="label">Architecture</span>
                    <span id="architecture">—</span>
                </div>

                <div>
                    <span class="label">Uptime</span>
                    <span id="uptime">—</span>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>CPU</h2>

            <div class="metric">
                <span>Usage</span>
                <strong id="cpu-usage">—</strong>
            </div>

            <div class="metric">
                <span>Load (1m)</span>
                <strong id="load-1m">—</strong>
            </div>

            <div class="metric">
                <span>Load (5m)</span>
                <strong id="load-5m">—</strong>
            </div>

            <div class="metric">
                <span>Load (15m)</span>
                <strong id="load-15m">—</strong>
            </div>
        </section>

        <section class="card">
            <h2>Memory</h2>

            <div class="metric">
                <span>Total</span>
                <strong id="memory-total">—</strong>
            </div>

            <div class="metric">
                <span>Used</span>
                <strong id="memory-used">—</strong>
            </div>

            <div class="metric">
                <span>Available</span>
                <strong id="memory-available">—</strong>
            </div>
        </section>

        <section class="card">
            <h2>Disk</h2>

            <div class="metric">
                <span>Total</span>
                <strong id="disk-total">—</strong>
            </div>

            <div class="metric">
                <span>Used</span>
                <strong id="disk-used">—</strong>
            </div>

            <div class="metric">
                <span>Free</span>
                <strong id="disk-free">—</strong>
            </div>
        </section>

        <section class="card wide">
            <h2>Network Interfaces</h2>

            <div id="interfaces">
                Loading...
            </div>
        </section>

        <section class="card wide">
            <h2>Connections</h2>

            <div class="connection">
                <span class="label">Default Gateway</span>
                <span id="gateway">—</span>
            </div>

            <div class="connection">
                <span class="label">DNS Servers</span>
                <span id="dns">—</span>
            </div>

            <div class="connection">
                <span class="label">Addresses</span>
                <div id="addresses">—</div>
            </div>

            <div class="connection">
                <span class="label">Routes</span>
                <div id="routes">—</div>
            </div>
        </section>

    </main>

    <footer>
        Last update: <span id="last-update">—</span>
    </footer>

    <script src="app.js"></script>
</body>
</html>
